# Standalone compose for local development. Identical to docker-compose.yml
# but kept separate so dev tweaks don't muddy the canonical file.
# Usage:  docker compose -f docker-compose.local.yml up -d --build

services:
  backend:
    build: ./backend
    container_name: bima-backend
    ports:
      - "8000:8000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_CHAT_MODEL=${OPENROUTER_CHAT_MODEL:-deepseek/deepseek-chat}
      - SQLITE_PATH=/app/data/bima.db
      - UPLOAD_DIR=/app/data/uploads
      - ESCALATION_WHATSAPP=${ESCALATION_WHATSAPP:-+62 812-0000-0000}
      - ESCALATION_EMAIL=${ESCALATION_EMAIL:-hr-it@bcalife.co.id}
      - CORS_ORIGINS=http://localhost:3000
      - SEED_DIR=/app/seed
    volumes:
      - backend_data:/app/data
      - ./dataset:/app/seed:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bima-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
