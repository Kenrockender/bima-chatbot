<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BIMA app icon - dialog mark">
  <defs>
    <linearGradient id="bg-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3A78"/>
      <stop offset="1" stop-color="#062048"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg-b)"/>

  <!-- Two concentric arcs = dialog / guidance (refined from v2-c, bolder for small sizes) -->
  <g transform="translate(512,512)" fill="none" stroke-linecap="round">
    <!-- outer arc, white, opens to bottom-right -->
    <path d="M -220 0 A 220 220 0 1 1 0 220" stroke="#FFFFFF" stroke-width="56"/>
    <!-- inner arc, gold, opens to top-left -->
    <path d="M 130 0 A 130 130 0 1 0 0 -130" stroke="#D4A24A" stroke-width="44"/>
  </g>
</svg>
