<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-label="BIMA modern sans wordmark">
  <!-- Modern sans-serif wordmark with subtle bespoke detail on the I (a tall accent bar) -->
  <g fill="#0A2A52" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <!-- main word -->
    <text x="210" y="68"
          text-anchor="middle"
          font-size="58"
          font-weight="600"
          letter-spacing="8">BIMA</text>

    <!-- bespoke accent: a tall thin gold stroke just to the right of the wordmark baseline,
         visually anchored under the I to feel intentional, not decorative -->
    <rect x="208.5" y="34" width="1.6" height="42" fill="#B98A3F"/>

    <!-- tagline -->
    <text x="210" y="96"
          text-anchor="middle"
          font-size="9.5"
          font-weight="500"
          letter-spacing="6"
          fill="#6A788E">BCA   LIFE   INTELLIGENT   ASSISTANT</text>
  </g>
</svg>
