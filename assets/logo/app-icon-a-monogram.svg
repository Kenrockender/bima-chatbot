<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="BIMA app icon - monogram B">
  <defs>
    <linearGradient id="bg-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E3A78"/>
      <stop offset="1" stop-color="#062048"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square base (iOS uses superellipse mask; this is close enough) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg-a)"/>

  <!-- Subtle inner highlight for premium feel -->
  <rect x="0" y="0" width="1024" height="512" rx="224" fill="#FFFFFF" opacity="0.04"/>

  <!-- Custom geometric "B" — built from clean primitives, not a font glyph -->
  <g transform="translate(312,232)" fill="#FFFFFF">
    <!-- vertical spine -->
    <rect x="0" y="0" width="92" height="560" rx="6"/>
    <!-- upper bowl -->
    <path d="M92 0 H260 a160 140 0 0 1 0 280 H92 Z
             M92 80 H252 a80 60 0 0 1 0 120 H92 Z" fill-rule="evenodd"/>
    <!-- lower bowl (slightly larger, classic B proportion) -->
    <path d="M92 280 H276 a168 140 0 0 1 0 280 H92 Z
             M92 360 H268 a88 60 0 0 1 0 120 H92 Z" fill-rule="evenodd"/>
  </g>

  <!-- Gold accent dot (echoes wordmark series) -->
  <circle cx="800" cy="800" r="34" fill="#D4A24A"/>
</svg>
