<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 290" role="img" aria-label="BIMA — BCA Life Intelligent Mobile Assistant">
  <defs>
    <linearGradient id="bimaTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9FE3DE"/>
      <stop offset="55%" stop-color="#5FC5C0"/>
      <stop offset="100%" stop-color="#3FAFAA"/>
    </linearGradient>
    <linearGradient id="bimaInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B3F7A"/>
      <stop offset="100%" stop-color="#0E2754"/>
    </linearGradient>
    <radialGradient id="bimaShine" cx="35%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded teal tile -->
  <rect x="20" y="10" width="200" height="200" rx="40" ry="40" fill="url(#bimaTeal)"/>
  <rect x="20" y="10" width="200" height="200" rx="40" ry="40" fill="url(#bimaShine)"/>
  <rect x="20" y="10" width="200" height="200" rx="40" ry="40" fill="none" stroke="#1B3F7A" stroke-width="2.5" stroke-opacity="0.18"/>

  <!-- Antenna -->
  <line x1="120" y1="48" x2="120" y2="36" stroke="#1B3F7A" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="120" cy="32" r="5" fill="#1B3F7A"/>

  <!-- Headphones (ear cups) behind head -->
  <ellipse cx="60" cy="100" rx="14" ry="17" fill="#1B3F7A"/>
  <ellipse cx="60" cy="100" rx="7" ry="10" fill="#3FAFAA"/>
  <ellipse cx="180" cy="100" rx="14" ry="17" fill="#1B3F7A"/>
  <ellipse cx="180" cy="100" rx="7" ry="10" fill="#3FAFAA"/>

  <!-- Headband arc -->
  <path d="M60 88 Q120 50 180 88" fill="none" stroke="#1B3F7A" stroke-width="4" stroke-linecap="round"/>

  <!-- Head (rounded square) -->
  <rect x="62" y="60" width="116" height="92" rx="34" ry="34" fill="#ffffff" stroke="#1B3F7A" stroke-width="3"/>

  <!-- Eyes (happy closed arcs) -->
  <path d="M92 104 q9 -12 18 0" fill="none" stroke="#1B3F7A" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 104 q9 -12 18 0" fill="none" stroke="#1B3F7A" stroke-width="5" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <circle cx="84" cy="120" r="5" fill="#F8B4B4" opacity="0.75"/>
  <circle cx="156" cy="120" r="5" fill="#F8B4B4" opacity="0.75"/>

  <!-- Smile -->
  <path d="M104 128 q16 14 32 0" fill="none" stroke="#1B3F7A" stroke-width="4" stroke-linecap="round"/>

  <!-- Body bubbles (two overlapping speech-bubble shapes) -->
  <path d="M75 165
           q0 -14 14 -14
           h28
           q14 0 14 14
           v18
           q0 14 -14 14
           h-6
           l-10 10
           v-10
           h-12
           q-14 0 -14 -14 z"
        fill="#ffffff" stroke="#1B3F7A" stroke-width="3"/>
  <path d="M118 175
           q0 -14 14 -14
           h22
           q14 0 14 14
           v14
           q0 14 -14 14
           h-22
           q-14 0 -14 -14 z"
        fill="#ffffff" stroke="#1B3F7A" stroke-width="3"/>

  <!-- BIMA wordmark -->
  <g fill="url(#bimaInk)" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
    <text x="120" y="252" text-anchor="middle" font-size="56" font-weight="900" letter-spacing="2">BIMA</text>
    <text x="120" y="276" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="0.6" fill="#2A4B85">
      BCA Life Intelligent Mobile Assistant
    </text>
  </g>
</svg>
